[unix_http_server]
file=/tmp/background-supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
pidfile=/tmp/background-supervisor.pid
logfile=/dev/null
logfile_maxbytes=0
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/background-supervisor.sock

[program:worker]
directory=/var/www/html
command=php artisan queue:work --queue=default,queue-test,record-visitor,black-list-log,push-time --sleep=1 --tries=3 --timeout=120
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
stopwaitsecs=130

[program:scheduler]
directory=/var/www/html
command=php artisan schedule:work
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
stopwaitsecs=130
