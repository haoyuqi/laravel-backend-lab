name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag to preview (never publishes)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - name: Validate stable tag on master
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: python3 .github/scripts/release-notes.py validate --tag "$RELEASE_TAG"

  checks:
    needs: validate
    if: github.event_name == 'push'
    uses: ./.github/workflows/tests.yml

  images:
    name: Image (${{ matrix.arch }})
    needs: [validate, checks]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.validate.outputs.tag }}
      REVISION: ${{ needs.validate.outputs.sha }}
    steps:
      - name: Checkout the validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the checkout matches the validated commit
        run: test "$(git rev-parse HEAD)" = "${{ needs.validate.outputs.sha }}"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve the release version
        id: release
        run: |
          version=$(python3 .github/scripts/image-release.py tags --tag "$VERSION" | jq -r '.version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check for an existing version tag
        id: preflight
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          tag="$IMAGE:${{ steps.release.outputs.version }}"

          if ! docker buildx imagetools inspect "$tag" > /dev/null 2>&1; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          revision=$(docker buildx imagetools inspect "$tag" --format '{{json .Image}}' \
            | jq -r --arg platform "$PLATFORM" '.[$platform].config.Labels["org.opencontainers.image.revision"] // empty')

          if [ "$revision" != "$REVISION" ]; then
            echo "::error::$tag already exists with revision '$revision', expected '$REVISION'."
            exit 1
          fi

          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' \
            | jq -r --arg arch "$ARCH" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' \
            | head -n 1)

          test -n "$digest"

          {
            echo "reuse=true"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        if: steps.preflight.outputs.reuse != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Attestations are disabled until the manifest promotion preserves them.
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ needs.validate.outputs.sha }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      - name: Record the platform digest
        id: digest
        env:
          REUSED: ${{ steps.preflight.outputs.reuse }}
          REUSED_DIGEST: ${{ steps.preflight.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ "$REUSED" = "true" ]; then
            digest="$REUSED_DIGEST"
          else
            digest="$BUILT_DIGEST"
          fi

          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify the image boots on this architecture
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail

          docker run -d --name image-check --network host \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e APP_URL=http://127.0.0.1:8080 \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=/var/www/html/storage/app/ci.sqlite \
            -e CACHE_STORE=file \
            -e SESSION_DRIVER=file \
            -e QUEUE_CONNECTION=sync \
            "$IMAGE@$DIGEST" > /dev/null

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/up > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done

          docker logs image-check
          exit 1

      - name: Save the platform digest
        run: |
          mkdir -p platform-digest
          printf '%s\n' "${{ steps.digest.outputs.digest }}" > platform-digest/digest.txt

      - name: Upload the platform digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.arch }}
          path: platform-digest/digest.txt
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  manifest:
    needs: [validate, images]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.index.outputs.version }}
      digest: ${{ steps.index.outputs.digest }}
      digest_amd64: ${{ steps.index.outputs.digest_amd64 }}
      digest_arm64: ${{ steps.index.outputs.digest_arm64 }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download platform digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: image-digest-*
          path: digests

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Create and verify the multi-architecture index
        id: index
        run: |
          set -euo pipefail

          version=$(python3 .github/scripts/image-release.py tags --tag "$TAG" | jq -r '.version')
          digest_amd64=$(cat digests/image-digest-amd64/digest.txt)
          digest_arm64=$(cat digests/image-digest-arm64/digest.txt)

          docker buildx imagetools create \
            -t "$IMAGE:$version" \
            "$IMAGE@$digest_amd64" \
            "$IMAGE@$digest_arm64"

          platforms=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest}}' \
            | jq -c '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort')
          test "$platforms" = '["amd64","arm64"]'

          index_digest=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{.Manifest.Digest}}')

          {
            echo "version=$version"
            echo "digest=$index_digest"
            echo "digest_amd64=$digest_amd64"
            echo "digest_arm64=$digest_arm64"
          } >> "$GITHUB_OUTPUT"

  aliases:
    name: Promote aliases
    needs: [validate, manifest]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: ghcr-alias-promotion
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Promote moving aliases without going backwards
        env:
          VERSION: ${{ needs.manifest.outputs.version }}
          DIGEST_AMD64: ${{ needs.manifest.outputs.digest_amd64 }}
          DIGEST_ARM64: ${{ needs.manifest.outputs.digest_arm64 }}
        run: |
          set -euo pipefail

          aliases=$(python3 .github/scripts/image-release.py tags --tag "${{ needs.validate.outputs.tag }}" | jq -r '.aliases[]')

          for alias in $aliases; do
            current=$(docker buildx imagetools inspect "$IMAGE:$alias" --format '{{json .Image}}' 2> /dev/null \
              | jq -r '[to_entries[].value.config.Labels["org.opencontainers.image.version"]][0] // empty') || current=""

            if [ -n "$current" ] && ! python3 .github/scripts/image-release.py newer --candidate "$VERSION" --current "$current"; then
              echo "Keeping $alias at $current (not older than $VERSION)."
              continue
            fi

            docker buildx imagetools create \
              -t "$IMAGE:$alias" \
              "$IMAGE@$DIGEST_AMD64" \
              "$IMAGE@$DIGEST_ARM64"

            echo "Promoted $alias to $VERSION."
          done

  notes:
    needs: [validate, checks, images, manifest]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (github.event_name == 'workflow_dispatch' || (needs.checks.result == 'success' && needs.manifest.result == 'success')) }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - name: Generate bilingual notes
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_TOKEN: ${{ secrets.RELEASE_NOTES_TOKEN }}
          RELEASE_NOTES_BASE_URL: ${{ secrets.RELEASE_NOTES_BASE_URL }}
          RELEASE_NOTES_MODEL: ${{ secrets.RELEASE_NOTES_MODEL }}
        run: python3 .github/scripts/release-notes.py generate --tag "$RELEASE_TAG"
      - name: Save notes for review or publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  publish:
    needs: [validate, aliases, notes, manifest]
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes

      - name: Append published image references
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          PACKAGE_URL: https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}
          VERSION: ${{ needs.manifest.outputs.version }}
          IMAGE_DIGEST: ${{ needs.manifest.outputs.digest }}
          DIGEST_AMD64: ${{ needs.manifest.outputs.digest_amd64 }}
          DIGEST_ARM64: ${{ needs.manifest.outputs.digest_arm64 }}
        run: |
          {
            echo ""
            echo "## Container images"
            echo ""
            echo "| Platform | Reference |"
            echo "| --- | --- |"
            echo "| Multi-arch | [\`${IMAGE}:${VERSION}\`](${PACKAGE_URL}) (\`${IMAGE_DIGEST}\`) |"
            echo "| linux/amd64 | \`${IMAGE}@${DIGEST_AMD64}\` |"
            echo "| linux/arm64 | \`${IMAGE}@${DIGEST_ARM64}\` |"
            echo ""
            echo "**Package:** ${PACKAGE_URL}"
            echo ""
            echo "\`\`\`bash"
            echo "docker pull ${IMAGE}:${VERSION}"
            echo "docker pull ${IMAGE}:latest"
            echo "\`\`\`"
          } >> release-notes.md

      - name: Create release once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'Release already exists; keeping its notes unchanged.'
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md --latest
          fi
