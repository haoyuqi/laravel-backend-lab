name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    # 19:46 UTC is 03:46 Asia/Shanghai on the following day.
    - cron: '46 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pint:
    name: Laravel Pint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        env:
          update: 'true'
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-scripts

      - name: Run Laravel Pint
        run: ./vendor/bin/pint --test

  production-smoke:
    name: Production installation smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: production
      APP_DEBUG: 'false'
      CACHE_STORE: file
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: log
      DB_CONNECTION: sqlite
      TELESCOPE_ENABLED: 'false'
      DEBUGBAR_ENABLED: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        env:
          update: 'true'
        with:
          php-version: '8.4'
          extensions: redis, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Set production smoke database path
        run: echo "DB_DATABASE=$RUNNER_TEMP/production-smoke.sqlite" >> "$GITHUB_ENV"

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Prepare and cache the application
        run: |
          cp .env.example .env
          touch "$DB_DATABASE"
          php artisan key:generate
          php artisan package:discover
          php artisan filament:upgrade
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache

      - name: Verify production boot without development dependencies
        run: |
          php artisan route:list --except-vendor
          php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $kernel = $app->make(Illuminate\Contracts\Http\Kernel::class); $request = Illuminate\Http\Request::create("/up"); $response = $kernel->handle($request); $kernel->terminate($request, $response); exit($response->getStatusCode() === 200 ? 0 : 1);'

  sqlite-tests:
    name: SQLite tests (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIN_LINE_COVERAGE: '100'

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        env:
          update: 'true'
        with:
          php-version: '8.4'
          extensions: redis, pdo, pdo_sqlite
          tools: composer:v2
          coverage: pcov

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php-8.4-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-8.4-

      - name: Copy CI environment
        run: cp .env.ci .env

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate application key
        run: php artisan key:generate

      - name: Prepare application directories
        run: chmod -R 777 storage bootstrap/cache

      - name: Test CI coverage threshold
        run: python3 -m unittest discover -s .github/scripts -p 'test_ci_summary.py'

      - name: Run PHP tests
        run: |
          mkdir -p ci-data
          ./vendor/bin/phpunit --log-junit ci-data/junit.xml --coverage-clover ci-data/coverage.xml --coverage-html ci-data/coverage-html
        env:
          TEST_DB_CONNECTION: sqlite
          TEST_DB_DATABASE: ':memory:'

      - name: Collect SQLite metrics
        if: ${{ always() }}
        run: python3 .github/scripts/ci-summary.py collect sqlite '${{ job.status }}'

      - name: Upload SQLite metrics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-data-sqlite
          path: ci-data/sqlite.json
          retention-days: 7

      - name: Upload PHP coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-coverage
          path: |
            ci-data/coverage.xml
            ci-data/coverage-html/
          if-no-files-found: ignore
          retention-days: 7

  php-tests:
    name: PHP tests (PHP ${{ matrix.php-version }}, ${{ matrix.db.name }} ${{ matrix.db.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4']
        db:
          - name: mysql
            version: '8.0'
            driver: mysql
            service-port: 3306
            image: mysql:8.0
            env:
              MYSQL_ALLOW_EMPTY_PASSWORD: yes
              MYSQL_DATABASE: laravel
            health-cmd: mysqladmin ping --silent
            test-db-name: laravel_test
            test-db-user: root
            test-db-password: ''
          - name: mysql
            version: '8.4'
            driver: mysql
            service-port: 3306
            image: mysql:8.4
            env:
              MYSQL_ALLOW_EMPTY_PASSWORD: yes
              MYSQL_DATABASE: laravel
            health-cmd: mysqladmin ping --silent
            test-db-name: laravel_test
            test-db-user: root
            test-db-password: ''
          - name: postgres
            version: '17'
            driver: pgsql
            service-port: 5432
            image: postgres:17
            env:
              POSTGRES_USER: root
              POSTGRES_PASSWORD: password
              POSTGRES_DB: laravel
            health-cmd: pg_isready -U root
            test-db-name: laravel_test
            test-db-user: root
            test-db-password: password
          - name: postgres
            version: '18'
            driver: pgsql
            service-port: 5432
            image: postgres:18
            env:
              POSTGRES_USER: root
              POSTGRES_PASSWORD: password
              POSTGRES_DB: laravel
            health-cmd: pg_isready -U root
            test-db-name: laravel_test
            test-db-user: root
            test-db-password: password

    services:
      db:
        image: ${{ matrix.db.image }}
        env: ${{ matrix.db.env }}
        ports:
          - ${{ matrix.db.service-port }}:${{ matrix.db.service-port }}
        options: >-
          --health-cmd="${{ matrix.db.health-cmd }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        env:
          update: 'true'
        with:
          php-version: ${{ matrix.php-version }}
          extensions: redis, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-${{ matrix.php-version }}-

      - name: Copy CI environment
        run: cp .env.ci .env

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate application key
        run: php artisan key:generate

      - name: Prepare application directories
        run: chmod -R 777 storage bootstrap/cache

      - name: Run PHP tests
        run: |
          mkdir -p ci-data
          ./vendor/bin/phpunit --log-junit ci-data/junit.xml
        env:
          # The service initializes only `laravel`; migrations must create
          # the separate `laravel_test` database on the first test run.
          TEST_DB_CONNECTION: ${{ matrix.db.driver }}
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: ${{ matrix.db.service-port }}
          TEST_DB_DATABASE: ${{ matrix.db.test-db-name }}
          TEST_DB_USERNAME: ${{ matrix.db.test-db-user }}
          TEST_DB_PASSWORD: ${{ matrix.db.test-db-password }}

      - name: Collect database metrics
        if: ${{ always() }}
        run: python3 .github/scripts/ci-summary.py collect '${{ matrix.db.name }}-${{ matrix.db.version }}' '${{ job.status }}'

      - name: Upload database metrics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-data-${{ matrix.db.name }}-${{ matrix.db.version }}
          path: ci-data/${{ matrix.db.name }}-${{ matrix.db.version }}.json
          retention-days: 7

  security-checks:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        env:
          update: 'true'
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Audit Composer dependencies
        run: composer audit

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '^24.22.1'
          check-latest: true
          cache: npm

      - name: Audit Node dependencies
        run: npm audit --package-lock-only

  browser-tests:
    name: Browser tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: true
      matrix:
        node-version: ['^24.22.1']

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: laravel
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        env:
          update: 'true'
        with:
          php-version: '8.4'
          extensions: redis, pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php-8.4-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-8.4-

      - name: Copy CI environment
        run: cp .env.ci .env

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Install Node dependencies
        run: npm ci --quiet

      - name: Prefer Ubuntu HTTPS package mirrors
        run: |
          # The runner's preferred Azure HTTP mirror can stall large font downloads.
          # Keep Ubuntu's signed repositories and use its official HTTPS endpoints.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf '%s\tpriority:%s\n' \
              'https://archive.ubuntu.com/ubuntu/' 1 \
              'https://security.ubuntu.com/ubuntu/' 2 \
              | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi

      - name: Install Playwright system dependencies
        timeout-minutes: 8
        run: npx playwright install-deps

      - name: Install Playwright browsers
        timeout-minutes: 8
        run: npx playwright install

      - name: Build frontend assets
        run: npm run build

      - name: Generate application key
        run: php artisan key:generate

      - name: Prepare application directories
        run: chmod -R 777 storage bootstrap/cache

      - name: Publish Filament assets
        run: php artisan filament:upgrade

      - name: Run migrations & seed E2E data
        run: |
          php artisan migrate --force
          php artisan db:seed --class=E2EDataSeeder --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: laravel
          DB_USERNAME: root
          DB_PASSWORD: password

      - name: Run Playwright tests
        run: npx playwright test
        env:
          APP_URL: http://127.0.0.1:8000
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: laravel
          DB_USERNAME: root
          DB_PASSWORD: password
          TEST_DB_CONNECTION: pgsql
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 5432
          TEST_DB_DATABASE: laravel
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: password

      - name: Verify Reverb real-time updates
        run: npm run test:reverb

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  result:
    name: CI result
    if: ${{ always() }}
    needs: [pint, production-smoke, sqlite-tests, php-tests, security-checks, browser-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MIN_LINE_COVERAGE: '100'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download CI metrics
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          pattern: ci-data-*
          path: ci-data
          merge-multiple: true
      - name: Write run summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS_JSON" > ci-needs.json
          python3 .github/scripts/ci-summary.py render lab
      - name: Enforce exact SQLite line coverage
        run: python3 .github/scripts/ci-summary.py verify
      - name: Require every check to succeed
        env:
          PINT_RESULT: ${{ needs.pint.result }}
          PRODUCTION_RESULT: ${{ needs.production-smoke.result }}
          SQLITE_RESULT: ${{ needs.sqlite-tests.result }}
          PHP_RESULT: ${{ needs.php-tests.result }}
          SECURITY_RESULT: ${{ needs.security-checks.result }}
          BROWSER_RESULT: ${{ needs.browser-tests.result }}
        run: |
          for result in "$PINT_RESULT" "$PRODUCTION_RESULT" "$SQLITE_RESULT" "$PHP_RESULT" "$SECURITY_RESULT" "$BROWSER_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::Every CI job must succeed (Pint=$PINT_RESULT, production=$PRODUCTION_RESULT, SQLite=$SQLITE_RESULT, PHP=$PHP_RESULT, security=$SECURITY_RESULT, browser=$BROWSER_RESULT)."
              exit 1
            fi
          done
