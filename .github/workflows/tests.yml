name: Tests

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  php-tests:
    name: PHP tests (PHP ${{ matrix.php-version }}, ${{ matrix.db.name }} ${{ matrix.db.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: true
      matrix:
        php-version: ['8.3']
        db:
          # SQLite runs in-memory and needs no real DB service; the container
          # below is only a structural placeholder because `services` applies to
          # every matrix cell. The suite connects to sqlite `:memory:` instead.
          - name: sqlite
            version: 'default'
            driver: sqlite
            service-port: 3306
            image: mysql:8.0
            env:
              MYSQL_ALLOW_EMPTY_PASSWORD: yes
              MYSQL_DATABASE: laravel
            health-cmd: mysqladmin ping --silent
            test-db-name: ':memory:'
            test-db-user: root
            test-db-password: ''
          - name: mysql
            version: '8.0'
            driver: mysql
            service-port: 3306
            image: mysql:8.0
            env:
              MYSQL_ALLOW_EMPTY_PASSWORD: yes
              MYSQL_DATABASE: laravel
            health-cmd: mysqladmin ping --silent
            test-db-name: laravel
            test-db-user: root
            test-db-password: ''
          - name: mysql
            version: '8.4'
            driver: mysql
            service-port: 3306
            image: mysql:8.4
            env:
              MYSQL_ALLOW_EMPTY_PASSWORD: yes
              MYSQL_DATABASE: laravel
            health-cmd: mysqladmin ping --silent
            test-db-name: laravel
            test-db-user: root
            test-db-password: ''
          - name: postgres
            version: '17'
            driver: pgsql
            service-port: 5432
            image: postgres:17
            env:
              POSTGRES_USER: root
              POSTGRES_PASSWORD: password
              POSTGRES_DB: laravel
            health-cmd: pg_isready -U root
            test-db-name: laravel
            test-db-user: root
            test-db-password: password
          - name: postgres
            version: '18'
            driver: pgsql
            service-port: 5432
            image: postgres:18
            env:
              POSTGRES_USER: root
              POSTGRES_PASSWORD: password
              POSTGRES_DB: laravel
            health-cmd: pg_isready -U root
            test-db-name: laravel
            test-db-user: root
            test-db-password: password

    services:
      db:
        image: ${{ matrix.db.image }}
        env: ${{ matrix.db.env }}
        ports:
          - ${{ matrix.db.service-port }}:${{ matrix.db.service-port }}
        options: >-
          --health-cmd="${{ matrix.db.health-cmd }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: redis, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: npm

      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-${{ matrix.php-version }}-

      - name: Copy CI environment
        run: cp .env.ci .env

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Install npm dependencies
        run: npm ci --quiet

      - name: Build frontend assets
        run: npm run build

      - name: Generate application key
        run: php artisan key:generate

      - name: Prepare application directories
        run: chmod -R 777 storage bootstrap/cache

      - name: Run PHP tests
        run: php artisan test
        env:
          # Route PHPUnit's dedicated `testing` connection to this matrix cell.
          TEST_DB_CONNECTION: ${{ matrix.db.driver }}
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: ${{ matrix.db.service-port }}
          TEST_DB_DATABASE: ${{ matrix.db.test-db-name }}
          TEST_DB_USERNAME: ${{ matrix.db.test-db-user }}
          TEST_DB_PASSWORD: ${{ matrix.db.test-db-password }}

  browser-tests:
    name: Browser tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: true
      matrix:
        node-version: ['20']

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: laravel
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: redis, pdo_pgsql
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php-8.3-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-8.3-

      - name: Copy CI environment
        run: cp .env.ci .env

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Install Node dependencies
        run: npm ci --quiet

      - name: Install Playwright Browsers & Deps
        run: npx playwright install --with-deps

      - name: Build frontend assets
        run: npm run build

      - name: Generate application key
        run: php artisan key:generate

      - name: Prepare application directories
        run: chmod -R 777 storage bootstrap/cache

      - name: Run migrations & seed E2E data
        run: |
          php artisan migrate --force
          php artisan db:seed --class=E2EDataSeeder --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: laravel
          DB_USERNAME: root
          DB_PASSWORD: password

      - name: Run Playwright tests
        run: npx playwright test
        env:
          APP_URL: http://127.0.0.1:8000
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: laravel
          DB_USERNAME: root
          DB_PASSWORD: password
          TEST_DB_CONNECTION: pgsql
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 5432
          TEST_DB_DATABASE: laravel
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: password

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
