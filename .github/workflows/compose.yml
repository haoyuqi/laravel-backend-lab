name: Compose deployment

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Compose (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [production, development]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build production image under test
        if: matrix.mode == 'production'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: backend-lab-compose:ci
          target: production
          cache-from: type=gha,scope=container-amd64
          cache-to: type=gha,mode=max,scope=container-amd64
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '^24.22.1'
          cache: npm
      - name: Prepare browser verification
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify deployment and recovery
        env:
          COMPOSE_BROWSER_CHECK: 'true'
        run: bash .github/scripts/smoke-compose.sh '${{ matrix.mode }}'
      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-${{ matrix.mode }}-browser-results
          path: tests/e2e/.results/compose-results
          if-no-files-found: ignore
          retention-days: 7
