name: Feature request
description: Suggest an improvement to the Laravel multi-module reference application.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or unmet need should this address?
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What behavior would address the problem?
    validations:
      required: true
