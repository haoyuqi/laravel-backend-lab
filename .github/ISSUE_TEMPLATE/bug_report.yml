name: Bug report
description: Report a problem in the Laravel multi-module reference application.
title: "fix: "
labels:
  - bug
body:
  - type: input
    id: module
    attributes:
      label: Affected module
      description: Name the affected module.
      placeholder: Module name
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what is going wrong.
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the shortest steps that reproduce the problem.
      placeholder: |-
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: affected_versions
    attributes:
      label: Affected versions and commit
      description: Include the affected commit SHA and actual installed versions of PHP, Laravel, and any relevant database, Redis, or browser. Include only relevant components and do not prefix version numbers with v.
      placeholder: |-
        Commit:
        PHP:
        Laravel:
        Database (if relevant):
        Redis (if relevant):
        Browser (if relevant):
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Logs or screenshots (optional)
      description: Add relevant logs or screenshots if they help explain the problem.
    validations:
      required: false
